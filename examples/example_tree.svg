<ellipse cx="191" cy="892" rx="52" ry="50"/>
</g>
<ellipse cx="760" cy="1046" rx="300" ry="22" fill="#4F672C" opacity=".45"/>
<path d="M716 1040 C724 960 726 860 728 770 L768 770 C770 860 772 960 782 1040Z" fill="url(#bark)"/>
<path d="M738 800 C700 740 650 700 600 660 M752 790 C790 730 850 690 905 650 M746 780 C748 700 748 620 748 520" stroke="#5A4030" stroke-width="12" fill="none" stroke-linecap="round"/>
<g fill="#3E7A35">
<ellipse cx="748" cy="560" rx="262" ry="195"/>
<circle cx="560" cy="640" r="150"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<!-- quickmeasure example: drawn at 125 px per metre. Ground at y = 1040. The stick is 3.5 m tall with bands every 0.5 m and a
     black line at 3 m (y = 665). The tree's top is at y = 365, so it is 5.4 m tall. CC BY 4.0, see LICENSE-docs. -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC8E6"/><stop offset="1" stop-color="#E4F0F6"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DAA5B"/><stop offset="1" stop-color="#6E8C40"/></linearGradient>
<linearGradient id="bark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A4030"/><stop offset=".55" stop-color="#7A5A42"/><stop offset="1" stop-color="#4E3729"/></linearGradient>
</defs>
<rect width="1600" height="1200" fill="url(#sky)"/>
<path d="M0 930 C180 880 330 905 520 875 C720 845 900 900 1100 870 C1300 842 1460 880 1600 860 V1040 H0Z" fill="#B9CBA4"/>
<path d="M0 985 C260 960 520 985 800 970 C1080 955 1340 980 1600 965 V1040 H0Z" fill="#A3BC86"/>
<rect y="1040" width="1600" height="160" fill="url(#grass)"/>

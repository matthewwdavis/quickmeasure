</g>
<g fill="#4F9443">
<circle cx="700" cy="470" r="70"/>
<circle cx="590" cy="580" r="85"/>
<circle cx="860" cy="560" r="80"/>
<circle cx="760" cy="640" r="95"/>
</g>
<g fill="#6DB05A" opacity=".8">
<circle cx="690" cy="440" r="36"/>
<circle cx="575" cy="560" r="40"/>
<circle cx="835" cy="520" r="38"/>
</g>
<g>
<rect x="696" y="602.5" width="16" height="437.5" fill="#FFFFFF" stroke="#1D1D1D" stroke-width="1.5"/>
<rect x="696" y="977.5" width="16" height="62.5" fill="#D62828"/>
<rect x="696" y="852.5" width="16" height="62.5" fill="#D62828"/>
